    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hawkbg: '#050811',
                        surface: '#0b1120',
                        surfaceraised: '#10192b',
                        accent: '#00e5ff',
                        'accent-hover': '#00b8cc',
                        darkbg: '#050811'
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            color-scheme: dark;
            --hawk-bg: #050811;
            --hawk-surface: #0b1120;
            --hawk-surface-raised: #10192b;
            --hawk-blue: #00e5ff;
            --hawk-white: #f7f8fb;
            --hawk-muted: #94a3b8;
            --hawk-line: rgba(177, 195, 222, 0.15);
            --hawk-green: #55f2b1;
        }
        body {
            background-color: var(--hawk-bg);
            color: var(--hawk-white);
            font-family: Inter, "Segoe UI", Arial, sans-serif;
        }
    </style>
    <script>
        if (window.location.hash) {
            window.scrollTo(0, 0);
        }
    </script>
